name: Build Android APK

# NOTE: This project's Gradle wrapper jar (gradle/wrapper/gradle-wrapper.jar)
# was not included in the export from AI Studio, so this workflow installs
# Gradle directly (matching the version pinned in
# gradle/wrapper/gradle-wrapper.properties) instead of relying on ./gradlew.
# Opening the project in Android Studio works fine without any of this: the
# IDE will offer to regenerate the wrapper the first time you sync.

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Regenerate Gradle wrapper (jar was not exported by AI Studio)
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: exampprep-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  build-release:
    runs-on: ubuntu-latest
    needs: build-debug
    # Only produces a signed release APK once you've added these as
    # repository secrets: Settings -> Secrets and variables -> Actions
    #   KEYSTORE_BASE64  - `base64 -w0 your-upload-key.jks`
    #   STORE_PASSWORD
    #   KEY_PASSWORD     (key alias must be "upload")
    if: ${{ vars.ENABLE_RELEASE_BUILD == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Regenerate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: exampprep-pro-release-apk
          path: app/build/outputs/apk/release/*.apk
